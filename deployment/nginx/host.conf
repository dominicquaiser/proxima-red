# Plain-HTTP nginx config for the host-nginx deployment model (see
# docker-compose.host.yml). The HOST's system nginx terminates TLS and proxies
# to this container on 127.0.0.1:8090; this container only serves /static/ and
# proxies the rest to gunicorn.
#
# X-Forwarded-Proto is passed THROUGH from the host nginx ($http_x_forwarded_proto),
# not set from $scheme - there are two proxy hops, and Django needs the original
# https value so SECURE_SSL_REDIRECT doesn't loop.
#
# NB: the HOST nginx vhost must also forward the WebSocket upgrade for /ws/
# (both proxy hops need it) - see the vhost snippet in docs/deployment.md.

# WebSocket upgrade handling for the live-note sync socket (/ws/): forward the
# client's Upgrade intent, close the connection when there is none.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # No file uploads in this app; keep request bodies small.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebSockets (live-note sync). proxy_read/send_timeout must exceed the
    # client's 20s awareness keepalive so idle-but-healthy sockets stay open.
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
