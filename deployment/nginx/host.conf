# Plain-HTTP nginx config for the host-nginx deployment model (see
# docker-compose.host.yml). The HOST's system nginx terminates TLS and proxies
# to this container on 127.0.0.1:8090; this container only serves /static/ and
# proxies the rest to gunicorn.
#
# X-Forwarded-Proto is passed THROUGH from the host nginx ($http_x_forwarded_proto),
# not set from $scheme - there are two proxy hops, and Django needs the original
# https value so SECURE_SSL_REDIRECT doesn't loop.

server {
    listen 80;
    server_name _;

    # No file uploads in this app; keep request bodies small.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
